name: Unit Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: |
          ruff check .

  testing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends wget ca-certificates git build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev libxml2-dev libxslt1-dev libre2-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # html5-parser (pulled in by wpull) is built against the system libxml2,
          # so lxml must be built from source too (see [tool.uv] in pyproject.toml).
          pip install --no-binary lxml lxml
          pip install coverage
          pip install .
      - name: Run unittests with coverage report
        run: |
          coverage run --source=libgrabsite -m unittest discover -v -b -s tests/unit -t .
      - name: Generate coverage report
        if: always()
        run: |
          coverage xml --data-file=.coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Write coverage job summary
        # The job summary needs no token, so it works for PRs from forks too.
        if: always()
        run: |
          {
            echo "## Python Coverage ${{ matrix.python-version }}"
            echo '```'
            coverage report --data-file=.coverage || echo "No coverage data was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Build and run (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends wget curl ca-certificates git build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev libxml2-dev libxslt1-dev libre2-dev pkg-config
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install --no-binary lxml lxml
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Smoke test (offline)
        run: bash tests/offline-tests
      - name: Crawl a local server (online)
        run: bash tests/online-tests
      - name: Start gs-server, crawl, and check output
        run: bash tests/integration-tests
