[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grab-site"
dynamic = ["version"]
description = "The archivist's web crawler: WARC output, dashboard for all crawls, dynamic ignore patterns"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ivan Kozik", email = "ivan@ludios.org" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "click>=8.5.1",
  "wpull @ https://github.com/ArchiveTeam/ludios_wpull/releases/download/5.1.0/wpull-5.1.0-py3-none-any.whl",
  "manhole>=1.8.1",
  "lmdb>=3.0.0",
  "autobahn>=26.11.2",
  "google-re2>=1.1.20251105",
  "websockets>=17.4",
]

[project.scripts]
grab-site = "libgrabsite.main:main"
gs-server = "libgrabsite.server:main"
gs-dump-urls = "libgrabsite.dump_urls:main"

[tool.setuptools.dynamic]
version = { attr = "libgrabsite.__version__" }

[tool.uv]
# html5-parser (pulled in by wpull) is only distributed as an sdist and is built
# against the system libxml2. A binary lxml wheel bundles its own libxml2, and
# the two then refuse to load together. Build lxml from source instead.
no-binary-package = ["lxml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libgrabsite = ["*.html", "*.ico", "*.txt", "ignore_sets/*"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", ".venv"]

[tool.ruff.lint]
# Pyflakes errors plus pycodestyle errors that are always bugs.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# main.py and server.py must run code (faulthandler.enable(), txaio.use_asyncio())
# before importing modules that depend on it, so E402 is intentional there.
"src/libgrabsite/main.py" = ["E402"]
"src/libgrabsite/server.py" = ["E402"]
